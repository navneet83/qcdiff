[package]
name = "qcdiff-py"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for qcdiff: semantic diff for OpenQASM 3 quantum circuits"
publish = false

[lib]
name = "qcdiff"
crate-type = ["cdylib"]

[dependencies]
qcdiff-core = { version = "0.1.0", path = "../qcdiff-core" }
pyo3 = { version = "0.26", features = ["abi3-py39"] }
